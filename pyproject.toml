[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archer-prosess"
version = "0.1.0"
description = "Clinical desktop workstation for somatic VPM variant interpretation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.7",
    "keyring>=25.6",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "Pillow>=10.0",
    "reportlab>=4.2",
    "requests>=2.32",
    "websocket-client>=1.8",
]

[project.optional-dependencies]
dev = [
    "pypdf>=5.0",
    "pytest>=8.2",
]

[project.scripts]
archer-prosess = "archer_processor.__main__:main"
vpm-tolkning = "archer_processor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"archer_processor" = ["assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
